spring.application.name=newsletter-studio
server.port=8080

# H2 Database configuration - using file database so projects are saved across restarts
spring.datasource.url=jdbc:h2:file:./data/newsletter_db;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enable H2 console for debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# File upload properties (allow large images for newsletters)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Custom application properties
jwt.secret=9a6134762d1c441b8c1a1796b4bf0b3e6c0c45169a842bfae498c0b2d6a5416b
jwt.expiration=86400000
